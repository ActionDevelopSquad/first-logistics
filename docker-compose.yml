version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: first-logistics-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m

  delivery-service:
    build:
      context: .
      dockerfile: delivery-service/Dockerfile
    container_name: first-logistics-delivery-service
    ports:
      - "${DELIVERY_SERVICE_PORT:-8081}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=delivery
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: first-logistics-order-service
    ports:
      - "${ORDER_SERVICE_PORT:-8082}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=orders
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  hub-service:
    build:
      context: .
      dockerfile: hub-service/Dockerfile
    container_name: first-logistics-hub-service
    restart: unless-stopped
    ports:
      - "${HUB_SERVICE_PORT:-8083}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=hub
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      NAVER_MAP_CLIENT_ID: ${NAVER_MAP_CLIENT_ID}
      NAVER_MAP_CLIENT_SECRET: ${NAVER_MAP_CLIENT_SECRET}
      COMPANY_SERVICE_URL: http://company-service:8080
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  company-service:
    build:
      context: .
      dockerfile: company-service/Dockerfile
    container_name: first-logistics-company-service
    restart: unless-stopped
    ports:
      - "${COMPANY_SERVICE_PORT:-8084}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=company
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  product-service:
    build:
      context: .
      dockerfile: product-service/Dockerfile
    container_name: first-logistics-product-service
    restart: unless-stopped
    ports:
      - "${PRODUCT_SERVICE_PORT:-8085}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=product
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: first-logistics-notification-service
    restart: unless-stopped
    ports:
      - "${NOTIFICATION_SERVICE_PORT:-8086}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=notification
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  ai-service:
    build:
      context: .
      dockerfile: ai-service/Dockerfile
    container_name: first-logistics-ai-service
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8087}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      POSTGRES_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=ai
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  redis:
    image: redis:7.2-alpine
    container_name: first-logistics-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128m

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: first-logistics-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xmx160m -Xms128m"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: [ "CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list" ]
      interval: 15s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 300m

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: first-logistics-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "${KAFKA_UI_PORT:-8989}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    deploy:
      resources:
        limits:
          memory: 192m

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: first-logistics-eureka-server
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-19090}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/eureka/apps"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 300m

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: first-logistics-api-gateway
    restart: unless-stopped
    ports:
      - "${API_GATEWAY_PORT:-80}:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUERURI: ${KEYCLOAK_ISSUER_URI}
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      eureka-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 300m

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: first-logistics-user-service
    restart: unless-stopped
    ports:
      - "${USER_SERVICE_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_DEFAULT_ZONE}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_SERVER_URL}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}?currentSchema=users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KEYCLOAK_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT}
      JAVA_TOOL_OPTIONS: "-Xmx160m -Xms96m"
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 300m

  zipkin:
    image: openzipkin/zipkin
    container_name: first-logistics-zipkin
    restart: unless-stopped
    ports:
      - "${ZIPKIN_PORT:-9411}:9411"
    deploy:
      resources:
        limits:
          memory: 192m

  postgres-keycloak:
    image: postgres:16
    container_name: postgres-keycloak-1
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/keycloak/data
    volumes:
      - postgres-keycloak-data-1:/var/lib/postgresql/keycloak/data
    ports:
      - "${KEYCLOAK_DB_PORT:-3998}:5432"
    networks:
      - keycloak-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 192m

  keycloak:
    image: quay.io/keycloak/keycloak
    container_name: keycloak-server
    restart: unless-stopped
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: ${KEYCLOAK_DB_URL}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
    command:
      - start-dev
      - --import-realm
    ports:
      - "${KEYCLOAK_PORT:-3300}:8080"
    depends_on:
      postgres-keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./codefactory-realm.json:/opt/keycloak/data/import/codefactory-realm.json
    deploy:
      resources:
        limits:
          memory: 384m
    networks:
      - keycloak-net
      - default

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  postgres-keycloak-data-1:
  keycloak-data-1:

networks:
  keycloak-net: